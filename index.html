<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>🔥 مملكة النار 🔥</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ============ صفحة التسجيل ============ */
  #formWrap {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(circle at 50% 30%, #1a0f0a 0%, #0a0505 70%, #000 100%);
    display: block;
    overflow-y: auto;
    padding: 30px 20px 60px;
    z-index: 100;
  }
  #formWrap.show { display: block; }
  @keyframes formIn {
    from { opacity: 0; transform: scale(1.08) translateY(20px); filter: blur(8px); }
    to   { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
  }

  #formWrap::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(circle at 20% 80%, rgba(255,80,0,0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(255,150,0,0.06) 0%, transparent 50%);
    pointer-events: none;
    animation: bgPulse 6s ease-in-out infinite;
    z-index: 0;
  }
  @keyframes bgPulse {
    0%, 100% { opacity: 0.6; }
    50%      { opacity: 1; }
  }

  .container {
    position: relative;
    max-width: 460px;
    margin: 0 auto;
    z-index: 1;
    padding-bottom: 40px;
  }

  /* ============ العنوان ============ */
  .header {
    text-align: center;
    margin-bottom: 30px;
    position: relative;
  }

  .title-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 0.5px;
  }

  .title-text {
    background: linear-gradient(180deg, #ffea00 0%, #ff6b00 50%, #ff0033 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 8px rgba(255,80,0,0.6));
    animation: titleGlow 2s ease-in-out infinite;
  }
  @keyframes titleGlow {
    0%, 100% { filter: drop-shadow(0 0 8px rgba(255,80,0,0.6)); }
    50%      { filter: drop-shadow(0 0 18px rgba(255,150,0,0.9)); }
  }

  .flame {
    font-size: 32px;
    display: inline-block;
    animation: flameMove 0.8s ease-in-out infinite alternate;
    filter: drop-shadow(0 0 6px #ff6b00);
  }
  .flame:last-child { animation-delay: 0.4s; }
  @keyframes flameMove {
    0%   { transform: translateY(0) scale(1); filter: drop-shadow(0 0 6px #ff6b00); }
    100% { transform: translateY(-6px) scale(1.15); filter: drop-shadow(0 0 14px #ffcc00); }
  }

  /* ============ الحدود البركانية ============ */
  .lava-border {
    position: relative;
    border-radius: 14px;
    padding: 2px;
    background: linear-gradient(135deg, #ff3300, #ffaa00, #ff3300, #ff6600, #ff3300);
    background-size: 400% 400%;
    animation: lava1 3s linear infinite;
    margin-bottom: 20px;
    transition: background 0.5s;
  }
  .lava-border.mode2 {
    background: linear-gradient(90deg, #ff2200, #ff8800, #ff2200, #ffcc00, #ff2200);
    background-size: 300% 300%;
    animation: lava2 3s linear infinite;
  }
  .lava-border.mode3 {
    background: linear-gradient(45deg, #ff1100, #ff6600, #ff1100, #ff9900, #ff1100);
    background-size: 500% 500%;
    animation: lava3 3s linear infinite;
  }
  @keyframes lava1 {
    0%   { background-position: 0% 50%; box-shadow: 0 0 20px rgba(255,80,0,0.5), inset 0 0 10px rgba(255,80,0,0.3); }
    50%  { background-position: 100% 50%; box-shadow: 0 0 35px rgba(255,140,0,0.7), inset 0 0 15px rgba(255,140,0,0.4); }
    100% { background-position: 0% 50%; box-shadow: 0 0 20px rgba(255,80,0,0.5), inset 0 0 10px rgba(255,80,0,0.3); }
  }
  @keyframes lava2 {
    0%   { background-position: 0% 50%; box-shadow: 0 0 25px rgba(255,50,0,0.7); }
    50%  { background-position: 100% 50%; box-shadow: 0 0 15px rgba(255,180,0,0.5); }
    100% { background-position: 0% 50%; box-shadow: 0 0 25px rgba(255,50,0,0.7); }
  }
  @keyframes lava3 {
    0%   { background-position: 0% 50%; box-shadow: 0 0 30px rgba(255,100,0,0.8); }
    33%  { background-position: 50% 0%;  box-shadow: 0 0 20px rgba(255,60,0,0.5); }
    66%  { background-position: 100% 50%; box-shadow: 0 0 40px rgba(255,150,0,0.9); }
    100% { background-position: 0% 50%; box-shadow: 0 0 30px rgba(255,100,0,0.8); }
  }

  .field-inner {
    background: linear-gradient(180deg, #150a08 0%, #0a0505 100%);
    border-radius: 12px;
    padding: 16px 18px;
    position: relative;
    overflow: hidden;
  }
  .field-inner::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(90deg, transparent, rgba(255,150,0,0.06), transparent);
    animation: shine 3s linear infinite;
  }
  @keyframes shine {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  /* ============ الحقول ============ */
  .field {
    margin-bottom: 18px;
    position: relative;
    z-index: 1;
    animation: fieldIn 0.6s ease backwards;
  }
  .field:nth-child(1) { animation-delay: 0.2s; }
  .field:nth-child(2) { animation-delay: 0.4s; }
  .field:nth-child(3) { animation-delay: 0.6s; }
  .field:nth-child(4) { animation-delay: 0.8s; }
  @keyframes fieldIn {
    from { opacity: 0; transform: translateX(30px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  label {
    display: block;
    font-size: 14px;
    color: #ffa94d;
    font-weight: 700;
    margin-bottom: 8px;
    text-shadow: 0 0 8px rgba(255,150,0,0.4);
    padding-right: 8px;
  }

  input, select {
    width: 100%;
    padding: 14px 16px;
    border: none;
    border-radius: 10px;
    background: rgba(0,0,0,0.5);
    color: #fff;
    font-size: 16px;
    font-family: inherit;
    outline: none;
    border: 1px solid rgba(255,120,0,0.3);
    transition: all 0.3s;
    caret-color: #ff6b00;
  }
  input:focus, select:focus {
    border-color: #ff6b00;
    background: rgba(20,0,0,0.7);
    box-shadow: 0 0 0 3px rgba(255,107,0,0.15), inset 0 0 20px rgba(255,100,0,0.1);
  }
  input::placeholder { color: rgba(255,255,255,0.35); }
  select option { background: #1a0505; color: #fff; }

  #nickCheck {
    font-size: 13px;
    margin-top: 6px;
    min-height: 18px;
    padding-right: 8px;
  }

  /* ============ زر المسلم ============ */
  .muslim-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 20px 0 8px;
    padding: 12px 14px;
    background: rgba(0, 80, 30, 0.15);
    border: 1.5px solid rgba(0, 200, 80, 0.4);
    border-radius: 12px;
    cursor: pointer;
    color: #4ade80;
    font-size: 14px;
    font-weight: 700;
    transition: all 0.3s;
    text-shadow: 0 0 8px rgba(0, 200, 80, 0.3);
    animation: greenPulse 2s ease-in-out infinite;
  }
  .muslim-row:active { transform: scale(0.98); }
  .muslim-row.checked {
    background: rgba(0, 120, 40, 0.3);
    border-color: #22c55e;
    box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
  }
  @keyframes greenPulse {
    0%, 100% { box-shadow: 0 0 12px rgba(0, 200, 80, 0.25); }
    50%      { box-shadow: 0 0 22px rgba(0, 200, 80, 0.5); }
  }
  .muslim-box {
    width: 22px;
    height: 22px;
    border: 2px solid #22c55e;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: rgba(0,0,0,0.4);
  }
  .muslim-row.checked .muslim-box {
    background: #22c55e;
    box-shadow: 0 0 12px #22c55e;
  }
  .muslim-row.checked .muslim-box::after {
    content: '✓';
    color: #000;
    font-weight: bold;
    font-size: 16px;
  }

  /* ============ زر الإرسال ============ */
  #submitBtn {
    width: 100%;
    padding: 16px;
    margin-top: 22px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #ff8800, #ff3300, #ff8800);
    background-size: 200% 200%;
    color: #fff;
    font-size: 18px;
    font-weight: 900;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 1px;
    box-shadow: 0 0 25px rgba(255,80,0,0.6), inset 0 -3px 0 rgba(0,0,0,0.3);
    text-shadow: 0 0 10px rgba(255,255,255,0.5);
    animation: btnGrad 3s ease infinite;
  }
  @keyframes btnGrad {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }
  #submitBtn:active:not(:disabled) { transform: translateY(2px); }
  #submitBtn:disabled { opacity: 0.5; cursor: not-allowed; animation: none; }

  /* ============ زر كتم الموسيقى ============ */
  #muteBtn {
    position: fixed;
    top: 14px;
    left: 14px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: rgba(20,10,0,0.85);
    border: 2px solid rgba(255,120,0,0.5);
    color: #ff6b00;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 500;
    backdrop-filter: blur(8px);
    box-shadow: 0 0 15px rgba(255,80,0,0.4);
  }
  #muteBtn:active { transform: scale(0.9); }
  #muteBtn.muted {
    color: #666;
    border-color: rgba(255,255,255,0.2);
    box-shadow: none;
  }

  /* ============ رسالة الخطأ ============ */
  #errBox {
    background: linear-gradient(135deg, rgba(255,40,0,0.25), rgba(255,80,0,0.15));
    border: 1.5px solid rgba(255,80,0,0.7);
    color: #ffb4b4;
    padding: 14px 16px;
    border-radius: 12px;
    margin-bottom: 18px;
    font-size: 14px;
    line-height: 1.7;
    display: none;
    animation: errShake 0.5s;
    box-shadow: 0 0 25px rgba(255,80,0,0.4);
  }
  #errBox.show { display: block; }
  @keyframes errShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }

  /* ============ شاشة التحميل ============ */
  #loadingBox {
    text-align: center;
    padding: 60px 0;
    display: none;
  }
  #loadingBox.show { display: block; }
  .spinner {
    display: inline-block;
    width: 50px;
    height: 50px;
    border: 4px solid rgba(255,120,0,0.2);
    border-top-color: #ff6b00;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ============ شاشة الرفض ============ */
  #denyWrap {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(circle, #1a0000, #000);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9000;
    padding: 20px;
    text-align: center;
  }
  #denyWrap.show { display: flex; }
  #denyWrap.shake { animation: denyShake 0.7s; }
  @keyframes denyShake {
    0%, 100% { transform: translate(0,0); }
    10%, 50%, 90% { transform: translate(-10px, 0); }
    30%, 70% { transform: translate(10px, 0); }
  }
  .deny-content { max-width: 400px; }
  .deny-icon {
    font-size: 80px;
    margin-bottom: 20px;
    animation: denyIcon 1.5s ease-in-out infinite;
    filter: drop-shadow(0 0 20px rgba(255,0,0,0.8));
  }
  @keyframes denyIcon {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  .deny-text {
    font-size: 22px;
    font-weight: 900;
    color: #ff3333;
    line-height: 1.6;
    text-shadow: 0 0 20px rgba(255,0,0,0.8);
    animation: denyText 1.5s ease-in-out infinite;
  }
  @keyframes denyText {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  /* ============ شاشة النجاح ============ */
  #successWrap {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #000;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 8000;
    overflow: hidden;
    flex-direction: column;
  }
  #successWrap.show { display: flex; }

  #successSparks {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
  }

  .success-letters {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 4px;
    max-width: 90%;
    direction: rtl;
    position: relative;
    z-index: 2;
  }

  .letter {
    font-size: 70px;
    font-weight: 900;
    color: #ff8c00;
    text-shadow: 0 0 30px #ff6b00, 0 0 60px #ff3300, 0 0 90px #ff0000;
    opacity: 0;
    transform: scale(3) rotate(180deg);
    transition: all 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: inline-block;
    min-width: 40px;
  }
  .letter.in { opacity: 1; transform: scale(1) rotate(0); }
  .letter.shrink { font-size: 42px; }

  #successCaption {
    margin-top: 30px;
    font-size: 20px;
    font-weight: 900;
    color: #ffd76a;
    text-shadow: 0 0 20px #ff6b00;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.8s ease;
    text-align: center;
    padding: 0 20px;
    position: relative;
    z-index: 2;
  }
  #successCaption.in { opacity: 1; transform: translateY(0); }

  #enterBtn {
    display: inline-block;
    margin-top: 30px;
    padding: 15px 40px;
    background: linear-gradient(135deg, #22c55e, #16a34a, #22c55e);
    background-size: 200% 200%;
    color: #fff;
    text-decoration: none;
    border-radius: 14px;
    font-weight: 900;
    font-size: 18px;
    text-shadow: 0 0 10px rgba(255,255,255,0.6);
    box-shadow: 0 0 30px rgba(34,197,94,0.7);
    opacity: 0;
    transform: scale(0.5);
    transition: all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    animation: greenBtnGrad 3s ease infinite;
    position: relative;
    z-index: 2;
  }
  @keyframes greenBtnGrad {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  #enterBtn.in { opacity: 1; transform: scale(1); }

  #greenOverlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(circle at 50% 50%, #0d2a15, #041008);
    opacity: 0;
    transition: opacity 1.5s ease;
    z-index: 0;
  }
  #greenOverlay.in { opacity: 1; }

  #signature {
    position: fixed;
    bottom: 10px;
    right: 14px;
    font-size: 11px;
    color: rgba(255,200,100,0.55);
    letter-spacing: 0.4px;
    text-shadow: 0 0 8px rgba(255,150,0,0.4);
    z-index: 200;
    pointer-events: none;
    font-style: italic;
  }

  /* ============ كلمات النجاح (كلمة كاملة تنزل مع صوت) ============ */
  .word-stage {
    position: relative; z-index: 2; text-align: center;
    display: block; width: 100%; padding: 0 16px;
  }
  .word {
    display: block;
    font-size: 54px; font-weight: 900; line-height: 1.25;
    color: #ff8c00;
    text-shadow: 0 0 30px #ff6b00, 0 0 60px #ff3300;
    opacity: 0;
    -webkit-transform: translateY(-140px) scale(1.7);
    transform: translateY(-140px) scale(1.7);
    -webkit-transition: all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    transition: all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    margin: 6px 0;
    word-break: break-word;
  }
  .word.nick { color: #ffd76a; text-shadow: 0 0 30px #ff9d00, 0 0 70px #ff5500; }
  .word.fire { color: #ff3b1d; font-size: 64px; }
  .word.in { opacity: 1; -webkit-transform: translateY(0) scale(1); transform: translateY(0) scale(1); }

  #successWrap { overflow: hidden; }

  /* ============ بطاقة الحالة (انتهى / مسجل / خطأ اتصال) ============ */
  #statusBox { display: none; text-align: center; padding: 40px 10px; }
  #statusBox.show { display: block; }
  #statusBox .s-icon { font-size: 64px; margin-bottom: 14px; }
  #statusBox .s-text { font-size: 18px; line-height: 1.9; color: #ffd0a0; font-weight: 700; }
  #statusBox a.s-btn {
    display: inline-block; margin-top: 22px; padding: 13px 34px; border-radius: 12px;
    background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; text-decoration: none; font-weight: 900;
  }

  /* شاشة الرفض: أحمر أقوى */
  #denyWrap .deny-sub { margin-top: 14px; color: #ff9b9b; font-size: 15px; line-height: 1.8; }
</style>
</head>
<body>

<noscript>
  <div style="position:fixed;top:0;left:0;right:0;bottom:0;background:#000;color:#ffb36b;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:99999;font-size:18px;line-height:2;">
    🔥 مملكة النار 🔥<br>فعّل JavaScript في متصفحك لإكمال التسجيل.
  </div>
</noscript>

<audio id="audNort"  src="nort.mp3"  preload="auto"></audio>
<audio id="audLakab" src="lakab.mp3" preload="auto"></audio>
<audio id="audTaraf" src="taraf.mp3" preload="auto"></audio>
<audio id="audOmr"   src="omr.mp3"   preload="auto"></audio>
<audio id="audFf"    src="ff.mp3"    preload="auto"></audio>
<audio id="audTek"   src="tek.mp3"   preload="auto"></audio>
<audio id="audMusic" preload="none" loop></audio>

<button id="muteBtn" title="كتم/تشغيل الموسيقى">🔊</button>

<div id="denyWrap">
  <div class="deny-content">
    <div class="deny-icon">❌</div>
    <div class="deny-text">عذراً 🚫<br>هذه الصفحة ليست مقصودة لك<br>أنت لست العضو المقصود تسجيله</div>
    <div class="deny-sub">إذا كنت أنت العضو المقصود،<br>اضغط «التالي» في القروب مرة أخرى.</div>
  </div>
</div>

<div id="successWrap">
  <div id="greenOverlay"></div>
  <canvas id="successSparks"></canvas>
  <div class="word-stage" id="wordStage"></div>
  <a href="#" id="enterBtn" target="_blank" rel="noopener">🟢 الدخول</a>
</div>

<div id="formWrap" class="show">
  <div class="container">

    <div class="header">
      <div class="title-row">
        <span class="flame">🔥</span>
        <span class="title-text">مملكة النار</span>
        <span class="flame">🔥</span>
      </div>
    </div>

    <div id="loadingBox" class="show">
      <div class="spinner"></div>
      <div style="margin-top:15px; color:#ffa94d;">جار التحقق من الرابط...</div>
    </div>

    <div id="statusBox">
      <div class="s-icon" id="statusIcon">⌛</div>
      <div class="s-text" id="statusText"></div>
      <a href="#" class="s-btn" id="statusBtn" style="display:none;" target="_blank" rel="noopener">🟢 الدخول</a>
    </div>

    <div id="formContent" style="display:none;">
      <div id="errBox"></div>

      <div class="lava-border" id="lavaBorder">
        <div class="field-inner">
          <div class="field">
            <label>🪪 لقبك</label>
            <input type="text" id="nickname" placeholder="مثال: كاكاشي" maxlength="30" autocomplete="off">
            <div id="nickCheck"></div>
          </div>
          <div class="field">
            <label>🔰 من طرف مين دخلت؟</label>
            <input type="text" id="referrer" placeholder="اكتب اسم من دعاك" maxlength="40" autocomplete="off">
          </div>
          <div class="field">
            <label>⚧️ جنسك</label>
            <select id="gender">
              <option value="">— اختر —</option>
              <option value="ذكر">ذكر</option>
              <option value="أنثى">أنثى</option>
              <option value="مخصص">مخصص</option>
            </select>
          </div>
          <div class="field">
            <label>🎂 عمرك (اختياري)</label>
            <input type="number" id="age" placeholder="مثال: 18" min="5" max="99" inputmode="numeric">
          </div>
        </div>
      </div>

      <div class="muslim-row" id="muslimRow">
        <div class="muslim-box"></div>
        <div>انا مسلم ولا اعبد الا الخالق الاحد (الله)</div>
      </div>

      <button id="submitBtn" type="button">🔥 التالي</button>
    </div>

  </div>
</div>

<div id="signature">المطور: الجيسي ابن سوريا</div>

<script>
(function () {
  "use strict";

  function $(id) { return document.getElementById(id); }

  // ---------- معاملات الرابط ----------
  function getParam(name) {
    var q = (window.location.search || "").replace(/^\?/, "").split("&");
    for (var i = 0; i < q.length; i++) {
      var kv = q[i].split("=");
      if (decodeURIComponent(kv[0] || "") === name) {
        try { return decodeURIComponent((kv[1] || "").replace(/\+/g, " ")); } catch (e) { return kv[1] || ""; }
      }
    }
    return "";
  }

  var code = getParam("c");
  var api  = (getParam("api") || "").replace(/\/+$/, "");
  if (!api && /railway\.app$/.test(window.location.hostname)) api = window.location.origin;

  // 🔒 لا نرسل أي بيانات إلا لسيرفر موثوق (يمنع روابط مزيّفة تشير لسيرفر المهاجم).
  // لو استعملت دومين خاصاً أضفه هنا مثل: "bot.example.com"
  var TRUSTED_HOSTS = [];
  function apiTrusted(u) {
    var m = /^https:\/\/([^\/:?#]+)(?::\d+)?$/i.exec(u || "");
    if (!m) return false;
    var h = m[1].toLowerCase();
    if (/\.railway\.app$/.test(h)) return true;
    if (h === window.location.hostname.toLowerCase()) return true;
    for (var i = 0; i < TRUSTED_HOSTS.length; i++) if (TRUSTED_HOSTS[i] === h) return true;
    return false;
  }
  if (!apiTrusted(api)) api = "";

  // بصمة المتصفح (لقفل الرابط على أول جهاز يفتحه)
  var dev = "";
  try { dev = window.localStorage.getItem("fir_dev") || ""; } catch (e) {}
  if (!dev) {
    dev = "d" + Math.random().toString(36).slice(2, 12) + Date.now().toString(36);
    try { window.localStorage.setItem("fir_dev", dev); } catch (e) {}
  }

  // ---------- عناصر ----------
  var loadingBox = $("loadingBox"), statusBox = $("statusBox"), formContent = $("formContent");
  var errBox = $("errBox"), nickInput = $("nickname"), refInput = $("referrer");
  var genderInput = $("gender"), ageInput = $("age"), nickCheck = $("nickCheck");
  var submitBtn = $("submitBtn"), muslimRow = $("muslimRow"), lava = $("lavaBorder");
  var denyWrap = $("denyWrap"), successWrap = $("successWrap");
  var muteBtn = $("muteBtn"), audMusic = $("audMusic");

  var muslimChecked = false, finished = false;

  // ---------- أصوات ----------
  function playSound(id) {
    try {
      var a = $(id);
      if (!a) return;
      a.currentTime = 0;
      var p = a.play();
      if (p && p.catch) p.catch(function () {});
    } catch (e) {}
  }

  // الموسيقى تُحمَّل متأخرة (بعد أول لمسة) حتى لا تُبطئ الصفحة
  var musicStarted = false, musicMuted = false;
  function startMusic() {
    if (musicStarted) return;
    musicStarted = true;
    try {
      audMusic.src = "music.mp3";
      audMusic.volume = 0.3;
      var p = audMusic.play();
      if (p && p.catch) p.catch(function () { musicStarted = false; });
    } catch (e) { musicStarted = false; }
  }
  var firstTouch = false;
  function onFirstTouch() {
    if (firstTouch) return;
    firstTouch = true;
    if (!finished) startMusic();
  }
  document.addEventListener("touchstart", onFirstTouch, false);
  document.addEventListener("click", onFirstTouch, false);
  document.addEventListener("keydown", onFirstTouch, false);

  muteBtn.addEventListener("click", function () {
    musicMuted = !musicMuted;
    try { audMusic.muted = musicMuted; } catch (e) {}
    muteBtn.className = musicMuted ? "muted" : "";
    muteBtn.innerHTML = musicMuted ? "🔇" : "🔊";
    if (!musicMuted) startMusic();
  }, false);

  // ---------- شبكة (XHR يعمل في كل المتصفحات) ----------
  function post(path, data, cb, timeoutMs) {
    var done = false;
    function finish(err, status, json) { if (done) return; done = true; cb(err, status, json); }
    try {
      var xhr = new XMLHttpRequest();
      xhr.open("POST", api + path, true);
      xhr.setRequestHeader("Content-Type", "application/json");
      xhr.timeout = timeoutMs || 15000;
      xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4) return;
        var json = null;
        try { json = JSON.parse(xhr.responseText); } catch (e) {}
        if (xhr.status === 0) return finish(new Error("network"), 0, null);
        finish(null, xhr.status, json);
      };
      xhr.ontimeout = function () { finish(new Error("timeout"), 0, null); };
      xhr.onerror = function () { finish(new Error("network"), 0, null); };
      xhr.send(JSON.stringify(data));
    } catch (e) { finish(e, 0, null); }
  }

  function esc(t) {
    return String(t == null ? "" : t)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;").replace(/\n/g, "<br>");
  }

  // 🔤 اللقب: حروف عربية فقط (بدون تشكيل/تطويل/زخرفة/أرقام/رموز/إيموجي)
  var ARABIC_NICK = /^[\u0621-\u063A\u0641-\u064A]+( [\u0621-\u063A\u0641-\u064A]+)*$/;
  var NICK_MSG = "⚠️ اللقب بالحروف العربية فقط<br>بدون زخرفة أو تشكيل أو أرقام أو رموز أو إيموجي.";
  function cleanNick(v) { return String(v || "").replace(/^\s+|\s+$/g, "").replace(/\s+/g, " "); }

  // ---------- حالات العرض ----------
  function showStatus(icon, text, linkHref) {
    loadingBox.className = "";
    formContent.style.display = "none";
    $("statusIcon").innerHTML = icon;
    $("statusText").innerHTML = text;
    var b = $("statusBtn");
    if (linkHref) { b.href = linkHref; b.style.display = "inline-block"; } else { b.style.display = "none"; }
    statusBox.className = "show";
  }

  function showDeny() {
    finished = true;
    loadingBox.className = "";
    formContent.style.display = "none";
    statusBox.className = "";
    denyWrap.className = "show";
    setTimeout(function () { denyWrap.className = "show shake"; }, 30);
    playSound("audFf");
    try { audMusic.pause(); } catch (e) {}
    if (navigator.vibrate) { try { navigator.vibrate([200, 100, 200]); } catch (e) {} }
  }

  function showError(msg) {
    errBox.innerHTML = msg;
    errBox.className = "show";
    playSound("audFf");
    setTimeout(function () { errBox.className = ""; }, 6000);
  }

  // ---------- فحص الرابط ----------
  function initCheck(attempt) {
    if (!code || !api) {
      showStatus("🔗", "الرابط غير مكتمل.<br>افتح الصفحة من زر «التسجيل» الذي يرسله البوت لك.");
      return;
    }
    post("/api/flow/check-session", { code: code, dev: dev }, function (err, status, data) {
      if (err || !data) {
        if (attempt < 3) { return setTimeout(function () { initCheck(attempt + 1); }, 1500); }
        return showStatus("📡", "تعذّر الاتصال بالسيرفر.<br>تأكد من الإنترنت ثم أعد فتح الرابط.");
      }
      if (status === 403 || data.reason === "not_yours") return showDeny();
      if (data.valid === true) {
        loadingBox.className = "";
        formContent.style.display = "block";
        playSound("audNort");
        return;
      }
      if (data.reason === "registered") {
        return showStatus("✅", "أنت مسجل في مملكة النار بالفعل.", data.enterLink || "");
      }
      if (data.reason === "expired") {
        return showStatus("⌛", "انتهت صلاحية الرابط.<br>ارجع للقروب واضغط «التالي» مرة أخرى.");
      }
      showStatus("⚠️", "تعذّر التحقق من الرابط.<br>اضغط «التالي» في القروب للحصول على رابط جديد.");
    }, 12000);
  }

  // ---------- الحدود البركانية ----------
  var modes = ["", "mode2", "mode3"], mi = 0;
  setInterval(function () { mi = (mi + 1) % 3; lava.className = "lava-border" + (modes[mi] ? " " + modes[mi] : ""); }, 3000);

  // ---------- أصوات الحقول ----------
  nickInput.addEventListener("focus", function () { playSound("audLakab"); }, false);
  refInput.addEventListener("focus", function () { playSound("audTaraf"); }, false);
  ageInput.addEventListener("focus", function () { playSound("audOmr"); }, false);

  // ---------- توفر اللقب ----------
  var nickTimer = null;
  nickInput.addEventListener("input", function () {
    clearTimeout(nickTimer);
    var v = cleanNick(nickInput.value);
    if (v.length < 1) { nickCheck.innerHTML = ""; return; }
    if (!ARABIC_NICK.test(v)) {
      nickCheck.style.color = "#ff6b6b";
      nickCheck.innerHTML = "❌ حروف عربية فقط (بدون زخرفة أو رموز أو أرقام)";
      return;
    }
    if (v.length < 2) { nickCheck.innerHTML = ""; return; }
    nickTimer = setTimeout(function () {
      post("/api/flow/check-nickname", { code: code, dev: dev, nickname: v }, function (err, status, d) {
        if (err || !d) return;
        if (status === 403) return showDeny();
        if (d.invalid) { nickCheck.style.color = "#ff6b6b"; nickCheck.innerHTML = "❌ حروف عربية فقط (بدون زخرفة أو رموز أو أرقام)"; }
        else if (d.taken) { nickCheck.style.color = "#ff6b6b"; nickCheck.innerHTML = "❌ هذا اللقب مأخوذ"; }
        else { nickCheck.style.color = "#4ade80"; nickCheck.innerHTML = "✅ اللقب متاح"; }
      }, 8000);
    }, 500);
  }, false);

  // ---------- المسلم ----------
  muslimRow.addEventListener("click", function () {
    muslimChecked = !muslimChecked;
    muslimRow.className = "muslim-row" + (muslimChecked ? " checked" : "");
  }, false);

  // ---------- الإرسال ----------
  submitBtn.addEventListener("click", function () {
    var nickname = cleanNick(nickInput.value);
    var referrer = refInput.value.replace(/^\s+|\s+$/g, "");
    var gender = genderInput.value;

    if (nickname.length < 2) return showError("⚠️ اكتب لقباً من حرفين على الأقل.");
    if (!ARABIC_NICK.test(nickname)) return showError(NICK_MSG);
    if (referrer.length < 2) return showError("⚠️ اكتب من طرف من دخلت.");
    if (!gender) return showError("⚠️ اختر جنسك.");

    var age = null;
    if (ageInput.value !== "") {
      var n = parseInt(ageInput.value, 10);
      if (isNaN(n) || n < 5 || n > 99) return showError("⚠️ العمر يجب أن يكون بين 5 و 99.");
      age = n;
    }
    if (!muslimChecked) return showError("⚠️ يجب تأكيد الإقرار الأخضر أولاً.");

    submitBtn.disabled = true;
    submitBtn.innerHTML = "⏳ جار الإرسال...";

    post("/api/flow/submit", { code: code, dev: dev, nickname: nickname, referrer: referrer, gender: gender, age: age }, function (err, status, d) {
      submitBtn.disabled = false;
      submitBtn.innerHTML = "🔥 التالي";

      if (err || !d) return showError("⚠️ تعذّر الاتصال، حاول مرة أخرى.");
      if (status === 403 || d.reason === "not_yours") return showDeny();

      if (d.ok) return showSuccess(d.nickname || nickname, d.enterLink || "");

      if (d.errors) {
        var first = d.errors.nickname || d.errors.referrer || d.errors.gender || d.errors.age;
        return showError(esc(first || "⚠️ تحقق من البيانات."));
      }
      showError(esc(d.error || "⚠️ حدث خطأ."));
    }, 25000);
  }, false);

  // ============================================================
  // 🎬 النجاح: اللقب ← نورت ← مملكة ← النار (كل كلمة كاملة بصوت) ثم زر الدخول
  // ============================================================
  var sparksRunning = false;

  function startSparks() {
    var c = $("successSparks");
    if (!c || !c.getContext) return;
    var ctx = c.getContext("2d");
    function size() { c.width = window.innerWidth; c.height = window.innerHeight; }
    size(); window.addEventListener("resize", size, false);
    var ps = [], i;
    for (i = 0; i < 70; i++) ps.push(spawn(true));
    function spawn(initial) {
      return { x: Math.random() * c.width, y: initial ? Math.random() * c.height : c.height + 10,
               r: 1 + Math.random() * 2.6, v: 0.6 + Math.random() * 2.2, d: (Math.random() - 0.5) * 0.8,
               a: 0.4 + Math.random() * 0.6 };
    }
    sparksRunning = true;
    (function tick() {
      if (!sparksRunning) return;
      ctx.clearRect(0, 0, c.width, c.height);
      for (var k = 0; k < ps.length; k++) {
        var p = ps[k];
        p.y -= p.v; p.x += p.d;
        if (p.y < -10) ps[k] = spawn(false);
        ctx.beginPath();
        ctx.fillStyle = "rgba(255," + (100 + Math.floor(p.a * 120)) + ",0," + p.a + ")";
        ctx.arc(p.x, p.y, p.r, 0, 6.2832);
        ctx.fill();
      }
      (window.requestAnimationFrame || function (f) { setTimeout(f, 33); })(tick);
    })();
  }

  function showSuccess(nickname, enterLink) {
    finished = true;
    try { audMusic.pause(); } catch (e) {}
    successWrap.className = "show";
    var stage = $("wordStage");
    stage.innerHTML = "";
    setTimeout(function () { $("greenOverlay").className = "in"; }, 50);
    startSparks();

    var enter = $("enterBtn");
    enter.href = enterLink || "#";
    if (!enterLink) enter.style.display = "none";

    var words = [
      { t: nickname, c: "word nick" },
      { t: "نورت",   c: "word" },
      { t: "مملكة",  c: "word" },
      { t: "النار",  c: "word fire" }
    ];
    // لقب طويل → خط أصغر
    var nickSize = nickname.length > 14 ? 30 : (nickname.length > 9 ? 40 : 54);

    var idx = 0;
    function dropNext() {
      if (idx >= words.length) {
        return setTimeout(function () { enter.className = "in"; playSound("audNort"); }, 900);
      }
      var w = words[idx];
      var el = document.createElement("div");
      el.className = w.c;
      if (idx === 0) el.style.fontSize = nickSize + "px";
      el.appendChild(document.createTextNode(w.t));
      stage.appendChild(el);
      // reflow ثم دخول
      void el.offsetWidth;
      el.className = w.c + " in";
      playSound("audTek");
      idx++;
      setTimeout(dropNext, 1150);
    }
    setTimeout(dropNext, 900);
  }

  // ابدأ
  initCheck(1);
})();
</script>
</body>
</html>
