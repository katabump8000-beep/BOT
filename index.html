<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🔥 مملكة النار 🔥</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ============ فيديو المقدمة ============ */
  #introWrap {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 1s ease;
  }
  #introWrap.fade { opacity: 0; pointer-events: none; }

  #introVideo {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  /* شرارات فوق الفيديو عند الخروج */
  #sparks {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 2;
  }

  /* ============ صفحة التسجيل ============ */
  #formWrap {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 30%, #1a0f0a 0%, #0a0505 70%, #000 100%);
    display: none;
    overflow-y: auto;
    padding: 30px 20px 40px;
    z-index: 100;
  }
  #formWrap.show {
    display: block;
    animation: formIn 1.2s cubic-bezier(0.19, 1, 0.22, 1);
  }
  @keyframes formIn {
    from { opacity: 0; transform: scale(1.08) translateY(20px); filter: blur(8px); }
    to   { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
  }

  /* موجات نارية خلفية */
  #formWrap::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 80%, rgba(255,80,0,0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(255,150,0,0.06) 0%, transparent 50%);
    pointer-events: none;
    animation: bgPulse 6s ease-in-out infinite;
    z-index: 0;
  }
  @keyframes bgPulse {
    0%, 100% { opacity: 0.6; }
    50%      { opacity: 1; }
  }

  .container {
    position: relative;
    max-width: 460px;
    margin: 0 auto;
    z-index: 1;
    padding-bottom: 60px;
  }

  /* ============ العنوان مع الشعلة ============ */
  .header {
    text-align: center;
    margin-bottom: 30px;
    position: relative;
  }

  .title-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 0.5px;
  }

  .title-text {
    background: linear-gradient(180deg, #ffea00 0%, #ff6b00 50%, #ff0033 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 30px rgba(255,100,0,0.5);
    filter: drop-shadow(0 0 8px rgba(255,80,0,0.6));
    animation: titleGlow 2s ease-in-out infinite;
  }
  @keyframes titleGlow {
    0%, 100% { filter: drop-shadow(0 0 8px rgba(255,80,0,0.6)); }
    50%      { filter: drop-shadow(0 0 18px rgba(255,150,0,0.9)); }
  }

  .flame {
    font-size: 32px;
    display: inline-block;
    animation: flameMove 0.8s ease-in-out infinite alternate;
    filter: drop-shadow(0 0 6px #ff6b00);
  }
  .flame:last-child { animation-delay: 0.4s; }
  @keyframes flameMove {
    0%   { transform: translateY(0) scale(1); filter: drop-shadow(0 0 6px #ff6b00); }
    100% { transform: translateY(-6px) scale(1.15); filter: drop-shadow(0 0 14px #ffcc00); }
  }

  /* ============ الحدود البركانية ============ */
  .lava-border {
    position: relative;
    border-radius: 14px;
    padding: 2px;
    background: linear-gradient(135deg, #ff3300, #ffaa00, #ff3300, #ff6600, #ff3300);
    background-size: 400% 400%;
    animation: lava1 3s linear infinite;
    margin-bottom: 20px;
    transition: background 0.5s;
  }
  .lava-border.mode2 {
    background: linear-gradient(90deg, #ff2200, #ff8800, #ff2200, #ffcc00, #ff2200);
    background-size: 300% 300%;
    animation: lava2 3s linear infinite;
  }
  .lava-border.mode3 {
    background: linear-gradient(45deg, #ff1100, #ff6600, #ff1100, #ff9900, #ff1100);
    background-size: 500% 500%;
    animation: lava3 3s linear infinite;
  }
  @keyframes lava1 {
    0%   { background-position: 0% 50%; box-shadow: 0 0 20px rgba(255,80,0,0.5), inset 0 0 10px rgba(255,80,0,0.3); }
    50%  { background-position: 100% 50%; box-shadow: 0 0 35px rgba(255,140,0,0.7), inset 0 0 15px rgba(255,140,0,0.4); }
    100% { background-position: 0% 50%; box-shadow: 0 0 20px rgba(255,80,0,0.5), inset 0 0 10px rgba(255,80,0,0.3); }
  }
  @keyframes lava2 {
    0%   { background-position: 0% 50%; box-shadow: 0 0 25px rgba(255,50,0,0.7); }
    50%  { background-position: 100% 50%; box-shadow: 0 0 15px rgba(255,180,0,0.5); }
    100% { background-position: 0% 50%; box-shadow: 0 0 25px rgba(255,50,0,0.7); }
  }
  @keyframes lava3 {
    0%   { background-position: 0% 50%; box-shadow: 0 0 30px rgba(255,100,0,0.8); }
    33%  { background-position: 50% 0%;  box-shadow: 0 0 20px rgba(255,60,0,0.5); }
    66%  { background-position: 100% 50%; box-shadow: 0 0 40px rgba(255,150,0,0.9); }
    100% { background-position: 0% 50%; box-shadow: 0 0 30px rgba(255,100,0,0.8); }
  }

  .field-inner {
    background: linear-gradient(180deg, #150a08 0%, #0a0505 100%);
    border-radius: 12px;
    padding: 16px 18px;
    position: relative;
    overflow: hidden;
  }
  .field-inner::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,150,0,0.06), transparent);
    animation: shine 3s linear infinite;
  }
  @keyframes shine {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  /* ============ الحقول ============ */
  .field {
    margin-bottom: 18px;
    position: relative;
    z-index: 1;
    animation: fieldIn 0.6s ease backwards;
  }
  .field:nth-child(1) { animation-delay: 0.2s; }
  .field:nth-child(2) { animation-delay: 0.4s; }
  .field:nth-child(3) { animation-delay: 0.6s; }
  .field:nth-child(4) { animation-delay: 0.8s; }
  @keyframes fieldIn {
    from { opacity: 0; transform: translateX(30px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  label {
    display: block;
    font-size: 14px;
    color: #ffa94d;
    font-weight: 700;
    margin-bottom: 8px;
    text-shadow: 0 0 8px rgba(255,150,0,0.4);
    padding-right: 8px;
  }

  input, select {
    width: 100%;
    padding: 14px 16px;
    border: none;
    border-radius: 10px;
    background: rgba(0,0,0,0.5);
    color: #fff;
    font-size: 16px;
    font-family: inherit;
    outline: none;
    border: 1px solid rgba(255,120,0,0.3);
    transition: all 0.3s;
    caret-color: #ff6b00;
  }
  input:focus, select:focus {
    border-color: #ff6b00;
    background: rgba(20,0,0,0.7);
    box-shadow: 0 0 0 3px rgba(255,107,0,0.15), inset 0 0 20px rgba(255,100,0,0.1);
  }
  input::placeholder { color: rgba(255,255,255,0.35); }

  select option { background: #1a0505; color: #fff; }

  /* رسالة فحص اللقب */
  #nickCheck {
    font-size: 13px;
    margin-top: 6px;
    min-height: 18px;
    padding-right: 8px;
    transition: color 0.3s;
  }

  /* ============ زر المسلم ============ */
  .muslim-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 20px 0 8px;
    padding: 12px 14px;
    background: rgba(0, 80, 30, 0.15);
    border: 1.5px solid rgba(0, 200, 80, 0.4);
    border-radius: 12px;
    cursor: pointer;
    color: #4ade80;
    font-size: 14px;
    font-weight: 700;
    transition: all 0.3s;
    text-shadow: 0 0 8px rgba(0, 200, 80, 0.3);
    animation: greenPulse 2s ease-in-out infinite;
  }
  .muslim-row:active { transform: scale(0.98); }
  .muslim-row.checked {
    background: rgba(0, 120, 40, 0.3);
    border-color: #22c55e;
    box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
  }
  @keyframes greenPulse {
    0%, 100% { box-shadow: 0 0 12px rgba(0, 200, 80, 0.25); }
    50%      { box-shadow: 0 0 22px rgba(0, 200, 80, 0.5); }
  }
  .muslim-box {
    width: 22px;
    height: 22px;
    border: 2px solid #22c55e;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: rgba(0,0,0,0.4);
    transition: all 0.2s;
  }
  .muslim-row.checked .muslim-box {
    background: #22c55e;
    box-shadow: 0 0 12px #22c55e;
  }
  .muslim-row.checked .muslim-box::after {
    content: '✓';
    color: #000;
    font-weight: bold;
    font-size: 16px;
  }

  /* ============ زر الإرسال ============ */
  #submitBtn {
    width: 100%;
    padding: 16px;
    margin-top: 22px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #ff8800, #ff3300, #ff8800);
    background-size: 200% 200%;
    color: #fff;
    font-size: 18px;
    font-weight: 900;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 1px;
    box-shadow: 0 0 25px rgba(255,80,0,0.6), inset 0 -3px 0 rgba(0,0,0,0.3);
    text-shadow: 0 0 10px rgba(255,255,255,0.5);
    transition: transform 0.15s, box-shadow 0.3s;
    animation: btnGrad 3s ease infinite;
    position: relative;
    overflow: hidden;
  }
  @keyframes btnGrad {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }
  #submitBtn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 0 40px rgba(255,120,0,0.9);
  }
  #submitBtn:active:not(:disabled) { transform: translateY(0); }
  #submitBtn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    animation: none;
  }

  /* ============ زر كتم الصوت ============ */
  #muteBtn {
    position: fixed;
    top: 14px;
    left: 14px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: rgba(20,10,0,0.85);
    border: 2px solid rgba(255,120,0,0.5);
    color: #ff6b00;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 500;
    backdrop-filter: blur(8px);
    transition: all 0.3s;
    box-shadow: 0 0 15px rgba(255,80,0,0.4);
  }
  #muteBtn:active { transform: scale(0.9); }
  #muteBtn.muted {
    color: #666;
    border-color: rgba(255,255,255,0.2);
    box-shadow: none;
  }

  /* ============ رسالة الخطأ ============ */
  #errBox {
    background: linear-gradient(135deg, rgba(255,40,0,0.25), rgba(255,80,0,0.15));
    border: 1.5px solid rgba(255,80,0,0.7);
    color: #ffb4b4;
    padding: 14px 16px;
    border-radius: 12px;
    margin-bottom: 18px;
    font-size: 14px;
    line-height: 1.7;
    display: none;
    animation: errShake 0.5s;
    text-shadow: 0 0 8px rgba(255,80,0,0.5);
    box-shadow: 0 0 25px rgba(255,80,0,0.4);
  }
  #errBox.show { display: block; }
  @keyframes errShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }

  /* ============ شاشة التحميل ============ */
  #loadingBox {
    text-align: center;
    padding: 60px 0;
    display: none;
  }
  #loadingBox.show { display: block; }
  .spinner {
    display: inline-block;
    width: 50px;
    height: 50px;
    border: 4px solid rgba(255,120,0,0.2);
    border-top-color: #ff6b00;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ============ شاشة الرفض ============ */
  #denyWrap {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle, #1a0000, #000);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9000;
    padding: 20px;
    text-align: center;
    animation: denyIn 0.5s;
  }
  #denyWrap.show { display: flex; }
  @keyframes denyIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  #denyWrap.shake { animation: denyShake 0.7s; }
  @keyframes denyShake {
    0%, 100% { transform: translate(0,0); }
    10%, 50%, 90% { transform: translate(-10px, 0); }
    30%, 70% { transform: translate(10px, 0); }
  }
  .deny-content {
    max-width: 400px;
  }
  .deny-icon {
    font-size: 80px;
    margin-bottom: 20px;
    animation: denyIcon 1.5s ease-in-out infinite;
    filter: drop-shadow(0 0 20px rgba(255,0,0,0.8));
  }
  @keyframes denyIcon {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  .deny-text {
    font-size: 22px;
    font-weight: 900;
    color: #ff3333;
    line-height: 1.6;
    text-shadow: 0 0 20px rgba(255,0,0,0.8), 0 0 40px rgba(255,0,0,0.4);
    animation: denyText 1.5s ease-in-out infinite;
  }
  @keyframes denyText {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  /* ============ شاشة النجاح السنمائية ============ */
  #successWrap {
    position: fixed;
    inset: 0;
    background: #000;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 8000;
    overflow: hidden;
    flex-direction: column;
  }
  #successWrap.show { display: flex; }

  /* شرارات النجاح */
  #successSparks {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .success-letters {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 4px;
    max-width: 90%;
    direction: rtl;
    position: relative;
    z-index: 2;
  }

  .letter {
    font-size: 70px;
    font-weight: 900;
    color: #ff8c00;
    text-shadow: 0 0 30px #ff6b00, 0 0 60px #ff3300, 0 0 90px #ff0000;
    opacity: 0;
    transform: scale(3) rotate(180deg);
    transition: all 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: inline-block;
    min-width: 40px;
  }
  .letter.in {
    opacity: 1;
    transform: scale(1) rotate(0);
  }
  .letter.shrink {
    font-size: 42px;
    text-shadow: 0 0 20px #ff6b00, 0 0 40px #ff3300;
  }

  #successCaption {
    margin-top: 30px;
    font-size: 20px;
    font-weight: 900;
    color: #ffd76a;
    text-shadow: 0 0 20px #ff6b00, 0 0 40px #ff3300;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.8s ease;
    text-align: center;
    padding: 0 20px;
    position: relative;
    z-index: 2;
  }
  #successCaption.in {
    opacity: 1;
    transform: translateY(0);
  }

  #enterBtn {
    display: inline-block;
    margin-top: 30px;
    padding: 15px 40px;
    background: linear-gradient(135deg, #22c55e, #16a34a, #22c55e);
    background-size: 200% 200%;
    color: #fff;
    text-decoration: none;
    border-radius: 14px;
    font-weight: 900;
    font-size: 18px;
    text-shadow: 0 0 10px rgba(255,255,255,0.6);
    box-shadow: 0 0 30px rgba(34,197,94,0.7), inset 0 -3px 0 rgba(0,0,0,0.3);
    opacity: 0;
    transform: scale(0.5);
    transition: all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    animation: greenBtnGrad 3s ease infinite;
    position: relative;
    z-index: 2;
  }
  @keyframes greenBtnGrad {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  #enterBtn.in {
    opacity: 1;
    transform: scale(1);
  }
  #enterBtn:active { transform: scale(0.95); }

  /* خلفية خضراء داكنة تظهر بعد النجاح */
  #greenOverlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, #0d2a15, #041008);
    opacity: 0;
    transition: opacity 1.5s ease;
    z-index: 0;
  }
  #greenOverlay.in { opacity: 1; }

  /* ============ التوقيع ============ */
  #signature {
    position: fixed;
    bottom: 10px;
    right: 14px;
    font-size: 11px;
    font-weight: 400;
    color: rgba(255,200,100,0.55);
    font-family: 'Tajawal', 'Segoe UI', sans-serif;
    letter-spacing: 0.4px;
    text-shadow: 0 0 8px rgba(255,150,0,0.4);
    z-index: 200;
    pointer-events: none;
    font-style: italic;
  }

</style>
</head>
<body>

<!-- ============ صوتيات مخفية ============ -->
<audio id="audNort"    src="nort.mp3"   preload="auto"></audio>
<audio id="audLakab"   src="lakab.mp3"  preload="auto"></audio>
<audio id="audTaraf"   src="taraf.mp3"  preload="auto"></audio>
<audio id="audOmr"     src="omr.mp3"    preload="auto"></audio>
<audio id="audFf"      src="ff.mp3"     preload="auto"></audio>
<audio id="audTek"     src="tek.mp3"    preload="auto"></audio>
<audio id="audMusic"   src="music.mp3"  preload="auto" loop></audio>

<!-- ============ فيديو المقدمة ============ -->
<div id="introWrap">
  <video id="introVideo" playsinline muted preload="auto" autoplay>
    <source src="intro.webm" type="video/webm">
    <source src="intro.mp4"  type="video/mp4">
  </video>
  <canvas id="sparks"></canvas>
</div>

<!-- ============ زر كتم الصوت ============ -->
<button id="muteBtn" title="كتم/تشغيل">🔊</button>

<!-- ============ شاشة الرفض ============ -->
<div id="denyWrap">
  <div class="deny-content">
    <div class="deny-icon">❌</div>
    <div class="deny-text">
      هذه الصفحة مخصصة<br>للعضو الممنشن له ⛔
    </div>
  </div>
</div>

<!-- ============ شاشة النجاح ============ -->
<div id="successWrap">
  <div id="greenOverlay"></div>
  <canvas id="successSparks"></canvas>
  <div class="success-letters" id="successLetters"></div>
  <div id="successCaption">👑 اللقب نورت مملكة النار 🔥</div>
  <a href="#" id="enterBtn" target="_blank">🟢 الدخول</a>
</div>

<!-- ============ صفحة التسجيل ============ -->
<div id="formWrap">
  <div class="container">

    <div class="header">
      <div class="title-row">
        <span class="flame">🔥</span>
        <span class="title-text">مملكة النار</span>
        <span class="flame">🔥</span>
      </div>
    </div>

    <div id="loadingBox" class="show">
      <div class="spinner"></div>
      <div style="margin-top:15px; color:#ffa94d;">جار التحقق من الرابط...</div>
    </div>

    <div id="formContent" style="display:none;">
      <div id="errBox"></div>

      <div class="lava-border" id="lavaBorder">
        <div class="field-inner">

          <div class="field">
            <label>🪪 لقبك</label>
            <input type="text" id="nickname" placeholder="مثال: كاكاشي" maxlength="30" autocomplete="off">
            <div id="nickCheck"></div>
          </div>

          <div class="field">
            <label>🔰 من طرف مين دخلت؟</label>
            <input type="text" id="referrer" placeholder="اكتب اسم من دعاك" maxlength="40" autocomplete="off">
          </div>

          <div class="field">
            <label>⚧️ جنسك</label>
            <select id="gender">
              <option value="">— اختر —</option>
              <option value="ذكر">ذكر</option>
              <option value="أنثى">أنثى</option>
              <option value="مخصص">مخصص</option>
            </select>
          </div>

          <div class="field">
            <label>🎂 عمرك (اختياري)</label>
            <input type="number" id="age" placeholder="مثال: 18" min="5" max="99" inputmode="numeric">
          </div>

        </div>
      </div>

      <div class="muslim-row" id="muslimRow">
        <div class="muslim-box"></div>
        <div>انا مسلم ولا اعبد الا الخالق الاحد (الله)</div>
      </div>

      <button id="submitBtn">🔥 التالي</button>
    </div>

  </div>
</div>

<!-- ============ التوقيع ============ -->
<div id="signature">المطور: الجيسي ابن سوريا</div>

<script>
(function () {
  "use strict";

  // ============================================================
  // 1) قراءة البارامترات من الرابط
  // ============================================================
  const params = new URLSearchParams(location.search);
  const token        = (params.get("token") || "").trim();
  const bindingToken = (params.get("binding") || "").trim();
  const apiBase      = (params.get("api") || "").trim().replace(/\/$/, "");

  // ============================================================
  // 2) مراجع DOM
  // ============================================================
  const $ = (id) => document.getElementById(id);
  const introWrap      = $("introWrap");
  const introVideo     = $("introVideo");
  const sparks         = $("sparks");
  const formWrap       = $("formWrap");
  const formContent    = $("formContent");
  const loadingBox     = $("loadingBox");
  const errBox         = $("errBox");
  const lavaBorder     = $("lavaBorder");
  const muslimRow      = $("muslimRow");
  const submitBtn      = $("submitBtn");
  const muteBtn        = $("muteBtn");

  const nickInput      = $("nickname");
  const refInput       = $("referrer");
  const genderInput    = $("gender");
  const ageInput       = $("age");
  const nickCheck      = $("nickCheck");

  const denyWrap       = $("denyWrap");
  const successWrap    = $("successWrap");
  const successLetters = $("successLetters");
  const successCaption = $("successCaption");
  const enterBtn       = $("enterBtn");
  const greenOverlay   = $("greenOverlay");
  const successSparks  = $("successSparks");

  // ============================================================
  // 3) الأصوات
  // ============================================================
  const audNort  = $("audNort");
  const audLakab = $("audLakab");
  const audTaraf = $("audTaraf");
  const audOmr   = $("audOmr");
  const audFf    = $("audFf");
  const audTek   = $("audTek");
  const audMusic = $("audMusic");

  let soundMuted = false;

  function playSound(el, reset = true) {
    if (!el || soundMuted) return;
    try {
      if (reset) el.currentTime = 0;
      const p = el.play();
      if (p && p.catch) p.catch(() => {});
    } catch (_) {}
  }

  // ============================================================
  // 4) فيديو المقدمة → صفحة التسجيل
  // ============================================================
  function endIntro() {
    if (introWrap.classList.contains("fade")) return;
    startExitSparks();
    introWrap.classList.add("fade");
    setTimeout(() => {
      introWrap.style.display = "none";
      showForm();
    }, 1000);
  }

  introVideo.addEventListener("ended", endIntro);

  // احتياط: لو الفيديو ما حمّل أو فشل → ننتقل بعد 8.5 ثانية
  const introFallback = setTimeout(endIntro, 8500);

  introVideo.addEventListener("canplay", () => {
    introVideo.play().catch(() => {});
  });

  introVideo.addEventListener("error", () => {
    clearTimeout(introFallback);
    endIntro();
  });

  // ============================================================
  // 5) شرارات الخروج من المقدمة
  // ============================================================
  function startExitSparks() {
    const c = sparks;
    const ctx = c.getContext("2d");
    let W = c.width = window.innerWidth;
    let H = c.height = window.innerHeight;

    const parts = [];
    for (let i = 0; i < 120; i++) {
      parts.push({
        x: W * 0.5 + (Math.random() - 0.5) * W,
        y: H + Math.random() * 100,
        vx: (Math.random() - 0.5) * 3,
        vy: -2 - Math.random() * 5,
        size: 1 + Math.random() * 3,
        life: 1,
        decay: 0.008 + Math.random() * 0.015,
        hue: 20 + Math.random() * 40
      });
    }

    function loop() {
      ctx.clearRect(0, 0, W, H);
      let alive = 0;
      for (const p of parts) {
        if (p.life <= 0) continue;
        alive++;
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.08;
        p.life -= p.decay;
        const a = Math.max(0, p.life);
        ctx.fillStyle = `hsla(${p.hue}, 100%, ${50 + p.life * 30}%, ${a})`;
        ctx.shadowBlur = 15;
        ctx.shadowColor = `hsl(${p.hue}, 100%, 60%)`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (0.5 + p.life), 0, Math.PI * 2);
        ctx.fill();
      }
      if (alive > 0) requestAnimationFrame(loop);
    }
    loop();
  }

  // ============================================================
  // 6) تشغيل صفحة التسجيل
  // ============================================================
  function showForm() {
    formWrap.classList.add("show");

    // nort.mp3 مرة واحدة
    playSound(audNort, true);

    // music.mp3 خلفية (loop) — يُشغّل بعد تأخير بسيط
    setTimeout(() => {
      if (!soundMuted) {
        audMusic.volume = 0.5;
        audMusic.play().catch(() => {});
      }
    }, 500);

    // نمط الحدود البركانية كل 3 ثواني
    setInterval(() => {
      lavaBorder.classList.remove("mode2", "mode3");
      const r = Math.random();
      if (r < 0.33) lavaBorder.classList.add("mode2");
      else if (r < 0.66) lavaBorder.classList.add("mode3");
    }, 3000);

    // بدء فحص الرابط
    initCheck();
  }

  // ============================================================
  // 7) زر كتم الصوت
  // ============================================================
  muteBtn.addEventListener("click", () => {
    soundMuted = !soundMuted;
    if (soundMuted) {
      audMusic.pause();
      muteBtn.classList.add("muted");
      muteBtn.textContent = "🔇";
    } else {
      audMusic.play().catch(() => {});
      muteBtn.classList.remove("muted");
      muteBtn.textContent = "🔊";
    }
  });

  // ============================================================
  // 8) أصوات الحقول
  // ============================================================
  nickInput.addEventListener("focus", () => playSound(audLakab, true));
  refInput.addEventListener("focus",  () => playSound(audTaraf, true));
  ageInput.addEventListener("focus",  () => playSound(audOmr, true));
  // gender: بدون صوت

  // ============================================================
  // 9) زر "أنا مسلم"
  // ============================================================
  let muslimChecked = false;
  muslimRow.addEventListener("click", () => {
    muslimChecked = !muslimChecked;
    muslimRow.classList.toggle("checked", muslimChecked);
  });

  // ============================================================
  // 10) استدعاء الـ API
  // ============================================================
  async function apiCall(path, body, timeoutMs = 15000) {
    if (!apiBase) throw new Error("لا يوجد api");
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs);
    try {
      const res = await fetch(apiBase + path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
        signal: ctrl.signal
      });
      const data = await res.json().catch(() => ({}));
      return { status: res.status, data };
    } finally {
      clearTimeout(timer);
    }
  }

  // ============================================================
  // 11) فحص الرابط
  // ============================================================
  async function initCheck() {
    if (!token || !bindingToken || !apiBase) {
      showDeny();
      return;
    }

    try {
      const { status, data } = await apiCall("/api/flow/check-session", { token, bindingToken });

      // رفض: ليس لك
      if (status === 403 || data?.reason === "not_yours") {
        showDeny();
        return;
      }

      // مسجل مسبقاً
      if (data?.valid === false && data.reason === "registered") {
        loadingBox.classList.remove("show");
        if (data.enterLink) {
          window.location.href = data.enterLink;
        } else {
          showDeny("أنت مسجل بالفعل ✅");
        }
        return;
      }

      // انتهى
      if (data?.valid === false && data.reason === "expired") {
        showError("⌛ انتهت صلاحية الرابط. اطلب من المشرف رابطاً جديداً عبر أمر .جديد");
        loadingBox.classList.remove("show");
        formContent.style.display = "block";
        return;
      }

      // جاهز
      if (data?.valid === true) {
        loadingBox.classList.remove("show");
        formContent.style.display = "block";
        return;
      }

      showDeny();
    } catch (_) {
      showError("⚠️ تعذّر الاتصال بالبوت. حاول لاحقاً.");
      loadingBox.classList.remove("show");
      formContent.style.display = "block";
    }
  }

  // ============================================================
  // 12) رسالة الخطأ + ff.mp3
  // ============================================================
  function showError(msg) {
    errBox.textContent = msg;
    errBox.classList.remove("show");
    void errBox.offsetWidth; // لإعادة تشغيل الأنيميشن
    errBox.classList.add("show");
    playSound(audFf, true);
  }

  // ============================================================
  // 13) شاشة الرفض + اهتزاز + ff.mp3
  // ============================================================
  function showDeny(customMsg) {
    formWrap.style.display = "none";
    denyWrap.classList.add("show");
    if (customMsg) {
      denyWrap.querySelector(".deny-text").innerHTML = customMsg;
    }
    playSound(audFf, true);

    // اهتزاز
    try {
      if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]);
    } catch (_) {}

    // اهتزاز الصورة
    denyWrap.classList.add("shake");
    setInterval(() => {
      denyWrap.classList.remove("shake");
      void denyWrap.offsetWidth;
      denyWrap.classList.add("shake");
      try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (_) {}
    }, 3000);
  }

  // ============================================================
  // 14) فحص اللقب أثناء الكتابة
  // ============================================================
  let nickTimer = null;
  let nickOk = false;

  nickInput.addEventListener("input", () => {
    const v = nickInput.value.trim();
    nickCheck.textContent = "";
    nickOk = false;
    if (v.length < 2) return;

    clearTimeout(nickTimer);
    nickTimer = setTimeout(async () => {
      nickCheck.textContent = "⏳ جار التحقق...";
      nickCheck.style.color = "#ffa94d";
      try {
        const { data } = await apiCall("/api/flow/check-nickname", {
          token, bindingToken, nickname: v
        });
        if (data?.taken) {
          nickCheck.textContent = "❌ هذا اللقب مأخوذ";
          nickCheck.style.color = "#ff6b6b";
          nickOk = false;
          playSound(audFf, true);
        } else {
          nickCheck.textContent = "✅ اللقب متاح";
          nickCheck.style.color = "#4ade80";
          nickOk = true;
        }
      } catch (_) {
        nickCheck.textContent = "";
      }
    }, 500);
  });

  // قائمة ألقاب ممنوعة محلياً
  const BAD = /(الله|كس|خرا|خرء|كلب|عير|زب|شرموط|قحبة|طيز|نيك|سكس|عاهرة|حمار|خنزير)/i;

  // ============================================================
  // 15) إرسال التسجيل
  // ============================================================
  submitBtn.addEventListener("click", async () => {
    errBox.classList.remove("show");

    const nickname = nickInput.value.trim();
    const referrer = refInput.value.trim();
    const gender   = genderInput.value;
    const ageRaw   = ageInput.value.trim();

    if (nickname.length < 2)  return showError("⚠️ اكتب لقب من حرفين على الأقل.");
    if (nickname.length > 30) return showError("⚠️ اللقب طويل جداً (30 حرف كحد أقصى).");
    if (nickOk === false)     return showError("❌ اللقب مأخوذ — اختر لقباً آخر.");
    if (BAD.test(nickname))   return showError("⛔ هذا اللقب غير مناسب. اختر لقباً محترماً.");
    if (referrer.length < 2)  return showError("⚠️ اكتب من طرف من دخلت.");
    if (referrer.length > 40) return showError("⚠️ اسم الطرف طويل جداً (40 حرف).");
    if (!gender)              return showError("⚠️ اختر جنسك.");
    if (!muslimChecked)       return showError("⚠️ يجب تأكيد أنك مسلم.");

    let age = null;
    if (ageRaw !== "") {
      const n = parseInt(ageRaw, 10);
      if (!Number.isFinite(n) || n < 5 || n > 99) {
        return showError("⚠️ العمر يجب أن يكون بين 5 و 99.");
      }
      age = n;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "⏳ جار الإرسال...";

    try {
      const { status, data } = await apiCall("/api/flow/submit", {
        token, bindingToken, nickname, referrer, gender, age
      });

      if (status === 403) return showError(data?.error || "⛔ الرابط ليس لك.");
      if (data?.errors) {
        const first = Object.values(data.errors)[0];
        return showError(first);
      }
      if (!data?.ok) return showError(data?.error || "⚠️ تعذّر إكمال التسجيل.");

      // ✅ نجاح → الشاشة السنمائية
      showSuccess(data.nickname || nickname, data.enterLink);

    } catch (e) {
      showError("⚠️ تعذّر الاتصال: " + (e?.message || ""));
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "🔥 التالي";
    }
  });

  // ============================================================
  // 16) الشاشة السنمائية للنجاح
  // ============================================================
  function showSuccess(nickname, enterLink) {
    // إيقاف الموسيقى الخلفية بهدوء
    audMusic.pause();

    // إخفاء الفورم
    formWrap.style.opacity = "0";
    formWrap.style.transition = "opacity 0.8s";
    setTimeout(() => {
      formWrap.style.display = "none";
      successWrap.classList.add("show");
      animateLetters(nickname, enterLink);
    }, 800);
  }

  function animateLetters(nickname, enterLink) {
    // تفريغ الحروف
    successLetters.innerHTML = "";
    const chars = nickname.split("");
    const letters = [];

    // إنشاء عنصر لكل حرف
    chars.forEach((ch) => {
      if (ch === " ") {
        const sp = document.createElement("span");
        sp.className = "letter";
        sp.innerHTML = "&nbsp;";
        successLetters.appendChild(sp);
        letters.push(sp);
        return;
      }
      const el = document.createElement("span");
      el.className = "letter";
      el.textContent = ch;
      successLetters.appendChild(el);
      letters.push(el);
    });

    // كل حرف يأتي من اتجاه عشوائي
    const dirs = ["right", "top", "left"];
    letters.forEach((el, i) => {
      const dir = dirs[Math.floor(Math.random() * dirs.length)];
      if (dir === "right") el.style.transform = "translate(200px, -100px) scale(3) rotate(180deg)";
      else if (dir === "left") el.style.transform = "translate(-200px, -100px) scale(3) rotate(-180deg)";
      else el.style.transform = "translate(0, -300px) scale(3) rotate(180deg)";
    });

    // دخول الحروف واحداً واحداً
    letters.forEach((el, i) => {
      setTimeout(() => {
        el.style.transform = "";
        el.classList.add("in");
        playSound(audTek, true);
      }, 250 + i * 220);
    });

    // بعد ما تكتمل الحروف → shrink + caption + زر
    const totalTime = 250 + letters.length * 220 + 500;

    setTimeout(() => {
      letters.forEach(el => el.classList.add("shrink"));
    }, totalTime);

    setTimeout(() => {
      // خلفية خضراء داكنة
      greenOverlay.classList.add("in");
      successCaption.classList.add("in");
      startSuccessSparks();
    }, totalTime + 500);

    setTimeout(() => {
      if (enterLink) {
        enterBtn.href = enterLink;
        enterBtn.classList.add("in");
      }
    }, totalTime + 1200);
  }

  // ============================================================
  // 17) شرارات شاشة النجاح (خضراء/نارية)
  // ============================================================
  function startSuccessSparks() {
    const c = successSparks;
    const ctx = c.getContext("2d");
    let W = c.width = window.innerWidth;
    let H = c.height = window.innerHeight;

    window.addEventListener("resize", () => {
      W = c.width = window.innerWidth;
      H = c.height = window.innerHeight;
    });

    const parts = [];
    for (let i = 0; i < 80; i++) {
      parts.push(spawnParticle(W, H));
    }

    function spawnParticle(W, H) {
      return {
        x: Math.random() * W,
        y: H + Math.random() * 50,
        vx: (Math.random() - 0.5) * 1.5,
        vy: -1 - Math.random() * 3,
        size: 1 + Math.random() * 3,
        life: 1,
        decay: 0.004 + Math.random() * 0.008,
        hue: Math.random() < 0.5 ? 120 : 30 // أخضر أو برتقالي
      };
    }

    function loop() {
      if (!successWrap.classList.contains("show")) return;
      ctx.clearRect(0, 0, W, H);
      for (let i = 0; i < parts.length; i++) {
        const p = parts[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy -= 0.02;
        p.life -= p.decay;
        if (p.life <= 0) {
          parts[i] = spawnParticle(W, H);
          continue;
        }
        const a = Math.max(0, p.life);
        ctx.fillStyle = `hsla(${p.hue}, 100%, 60%, ${a})`;
        ctx.shadowBlur = 20;
        ctx.shadowColor = `hsl(${p.hue}, 100%, 60%)`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (0.5 + p.life), 0, Math.PI * 2);
        ctx.fill();
      }
      requestAnimationFrame(loop);
    }
    loop();
  }

})();
</script>
