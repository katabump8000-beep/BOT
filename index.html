<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>𝑨𝑳𝑱𝑬𝑺𝑰</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:#000 url('images/blue.png') no-repeat center center fixed;
    background-size: cover;
    min-height:100vh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    font-family:'Segoe UI', sans-serif;
    padding:20px;
  }
  body::before {
    content:''; position:fixed; inset:0;
    background:rgba(0,0,0,0.65); z-index:0;
  }

  .title {
    position:relative; z-index:1;
    color:#fff; font-size:2.2rem; margin-bottom:25px;
    text-shadow:0 0 20px #00aaff, 0 0 40px #00aaff;
    letter-spacing:3px;
    text-align:center;
  }

  .buttons {
    position:relative; z-index:1;
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:18px;
    max-width:900px;
    width:100%;
  }

  .btn-img {
    display:block;
    width:100%;
    cursor:pointer;
    transition:transform .3s, filter .3s;
    filter:drop-shadow(0 0 12px rgba(0,150,255,0.5));
  }
  .btn-img:hover {
    transform:scale(1.05);
    filter:drop-shadow(0 0 25px rgba(0,200,255,0.9)) brightness(1.15);
  }
  .btn-img:active { transform:scale(0.97); }

  @media(max-width:600px){
    .buttons { grid-template-columns:1fr; }
    .title { font-size:1.3rem; }
  }

  /* زر الموسيقى */
  #musicBtn {
    position:fixed;
    bottom:15px; left:15px;
    width:55px; height:55px;
    border:none;
    background:transparent;
    cursor:pointer;
    z-index:100;
    padding:0;
    transition:transform .3s, filter .3s;
    filter:drop-shadow(0 0 12px rgba(255,140,0,0.8));
  }
  #musicBtn img { width:100%; height:100%; display:block; }
  #musicBtn:hover { transform:scale(1.12); filter:drop-shadow(0 0 22px rgba(255,170,0,1)); }
  #musicBtn.playing { animation:spin 3s linear infinite; }
  @keyframes spin { from{transform:rotate(0);} to{transform:rotate(360deg);} }
</style>
</head>
<body>

  <h1 class="title">𝑨𝑳𝑱𝑬𝑺𝑰</h1>

  <div class="buttons">
    <a href="page1.html">
      <img src="images/blue.png" alt="النقابات والرتب" class="btn-img">
    </a>
    <a href="page2.html">
      <img src="images/green.png" alt="شروط الشرفات" class="btn-img">
    </a>
    <a href="page3.html">
      <img src="images/red.png" alt="قوانين الممالك" class="btn-img">
    </a>
    <a href="page4.html">
      <img src="images/purple.png" alt="الأرقى اللا" class="btn-img">
    </a>
  </div>

  <button id="musicBtn" onclick="toggleMusic()">
    <img src="images/music.png" alt="تشغيل الموسيقى">
  </button>

  <audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

<script>
  const music = document.getElementById('bgMusic');
  const btn = document.getElementById('musicBtn');
  let playing = false;

  // استرجاع الحالة من الصفحة السابقة (عشان تستمر بين الصفحات)
  if (sessionStorage.getItem('musicPlaying') === '1') {
    music.currentTime = parseFloat(sessionStorage.getItem('musicTime') || 0);
    music.play().then(() => {
      playing = true;
      btn.classList.add('playing');
    }).catch(()=>{});
  }

  function toggleMusic() {
    if (playing) {
      music.pause();
      btn.classList.remove('playing');
      sessionStorage.setItem('musicPlaying', '0');
    } else {
      music.play().catch(()=>{});
      btn.classList.add('playing');
      sessionStorage.setItem('musicPlaying', '1');
    }
    playing = !playing;
  }

  // حفظ الوقت قبل مغادرة الصفحة
  window.addEventListener('beforeunload', () => {
    sessionStorage.setItem('musicTime', music.currentTime);
  });

  // تشغيل تلقائي عند أول ضغطة
  document.addEventListener('click', function once() {
    if (!playing) {
      music.play().then(() => {
        playing = true;
        btn.classList.add('playing');
        sessionStorage.setItem('musicPlaying', '1');
      }).catch(()=>{});
    }
    document.removeEventListener('click', once);
  }, { once:true });
</script>

</body>
</html>
